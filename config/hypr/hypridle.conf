# ~/.config/hypr/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock       # Evita abrir múltiples instancias de hyprlock
    before_sleep_cmd = loginctl lock-session    # Bloquea la pantalla justo antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on  # Enciende la pantalla al despertar
}

# (Opcional) Oscurecer la pantalla tras 3 minutos de inactividad
listener {
    timeout = 180                                # 3 minutos (180 segundos)
    on-timeout = brightnessctl -s set 10         # Baja el brillo
    on-resume = brightnessctl -r                 # Restaura el brillo si mueves el mouse
}

# BLOQUEAR PANTALLA: Esto es lo que activa Hyprlock tras 5 minutos
listener {
    timeout = 300                                # 5 minutos (300 segundos)
    on-timeout = loginctl lock-session           # Comando que dispara el bloqueo (llama a lock_cmd)
}

# (Opcional) Apagar la pantalla tras 5.5 minutos
listener {
    timeout = 330                                # 5.5 minutos
    on-timeout = hyprctl dispatch dpms off       # Apaga el monitor
    on-resume = hyprctl dispatch dpms on         # Enciende el monitor al mover el mouse
}

