# ~/.config/hypr/hypridle.conf

general {
   # Bloqueo: MacLock (Quickshell). lock-via-ipc.sh no abre un segundo bloqueo si ya hay uno.
   # Respaldo manual con hyprlock: hyprlock
   lock_cmd = sh ~/.config/quickshell/MacLock/lock-via-ipc.sh
   # Antes de suspender: bloquear y esperar a que el bloqueo esté puesto (inhibit_sleep = 3)
   before_sleep_cmd = loginctl lock-session
   inhibit_sleep = 3
   # Con config en Lua, hyprctl dispatch usa la sintaxis hl.dsp.*
   after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Oscurecer la pantalla tras 3 minutos
listener {
   timeout = 180
   on-timeout = brightnessctl -s set 10
   on-resume = brightnessctl -r
}

# Bloquear pantalla tras 5 minutos (lock-session -> lock_cmd)
listener {
   timeout = 300
   on-timeout = loginctl lock-session
}

# Apagar monitor tras 5.5 minutos
listener {
   timeout = 330
   on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
   on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Con la pantalla bloqueada: apagar el monitor tras 60 s sin actividad (como el iPhone).
# La animación de la pantalla de bloqueo mantiene la GPU en un estado de más consumo (~+18 W).
listener {
   timeout = 60
   on-timeout = ~/.local/bin/dpms-if-locked off
   on-resume = ~/.local/bin/dpms-if-locked on
}
