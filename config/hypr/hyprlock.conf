# ~/.config/hypr/hyprlock.conf
# Refactorizado: Estilo iOS 17 / macOS - Full Screen Music Player (Portada Alta Res)

general {
    hide_cursor        = true
    ignore_empty_input = false
    immediate_render   = true
    text_trim          = true
    fail_timeout       = 2000
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier  = smoothIn,  0.25, 1,    0.5,  1
    bezier  = smoothOut, 0.36, 0,    0.66, -0.56
    bezier  = overshot,  0.05, 0.9,  0.1,  1.05
    animation = fadeIn,          1, 4, smoothIn
    animation = fadeOut,         1, 4, smoothOut
    animation = inputFieldDots,  1, 3, smoothIn
    animation = inputFieldColors,1, 4, smoothIn
}

# ─── FONDO ─────────────────────────────────────────────────────────────────
background {
    monitor        =
    path           = /tmp/hyprlock-mpris/bg.png
    color          = rgba(17, 17, 17, 1.0)
    reload_time    = 0
    reload_cmd     = echo /tmp/hyprlock-mpris/bg.png
    crossfade_time = 0.8
}

# ─── FECHA ─────────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] LC_ALL=es_MX.UTF-8 date +"%A, %d de %B" | sed 's/^./\\U&/'
    color       = rgba(255, 255, 255, 0.85)
    font_size   = 20
    font_family = SF Pro Display Medium
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.30)
    position    = 0, 450
    halign      = center
    valign      = center
}

# ─── RELOJ (Masivo y Bold tipo iOS 16/17) ──────────────────────────────────
label {
    monitor     =
    text        = $TIME
    color       = rgba(255, 255, 255, 1.0)
    font_size   = 110
    font_family = SF Pro Display Bold
    shadow_passes = 3
    shadow_size   = 8
    shadow_color  = rgba(0, 0, 0, 0.40)
    position    = 0, 350
    halign      = center
    valign      = center
}

# ─── PORTADA DEL ÁLBUM (Centro de atención - Tamaño 512) ───────────────────
image {
    monitor      =
    path         = /tmp/hyprlock-mpris/cover.png
    size         = 512
    rounding     = 0
    border_size  = 0
    reload_time  = 0
    reload_cmd   = echo /tmp/hyprlock-mpris/cover.png
    position     = 0, -10
    halign       = center
    valign       = center
    zindex       = 1
    shadow_passes = 3
    shadow_size   = 30
    shadow_color  = rgba(0, 0, 0, 0.55)
}

# ─── TÍTULO DE CANCIÓN (Animado / Efecto Marquee) ──────────────────────────
label {
    monitor     =
    text        = cmd[update:150] ~/.config/hypr/scripts/MediaCtrl.sh marquee-title
    color       = rgba(255, 255, 255, 1.0)
    font_size   = 22
    font_family = SF Pro Display Bold
    shadow_passes = 2
    shadow_size   = 5
    shadow_color  = rgba(0, 0, 0, 0.40)
    position    = 0, -320
    halign      = center
    valign      = center
    zindex      = 1
}

# ─── ARTISTA ───────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:0:true] cat /tmp/hyprlock-mpris/artist.txt 2>/dev/null || echo " "
    color       = rgba(255, 255, 255, 0.70)
    font_size   = 18
    font_family = SF Pro Display Medium
    shadow_passes = 1
    shadow_size   = 3
    shadow_color  = rgba(0, 0, 0, 0.30)
    position    = 0, -360
    halign      = center
    valign      = center
    zindex      = 1
}

# ─── INPUT FIELD (Estilo Píldora Frosted Glass macOS/iOS) ──────────────────
input-field {
    monitor    =
    size       = 260, 55
    outline_thickness = 0
    dots_size    = 0.25
    dots_spacing = 0.30
    dots_center  = true
    dots_rounding = -1

    inner_color = rgba(255, 255, 255, 0.20)
    font_color  = rgba(255, 255, 255, 1.0)
    
    outer_color = rgba(0, 0, 0, 0)
    check_color = rgba(255, 255, 255, 0.40)
    fail_color  = rgba(255, 59, 48, 0.50)

    font_family = SF Pro Display Medium

    fade_on_empty = true
    fade_timeout  = 2000
    placeholder_text = <span foreground="##ffffffbb" font_desc="SF Pro Display 14">Contraseña</span>
    fail_text        = <span foreground="##ff3b30ff" font_desc="SF Pro Display 14"><i>Reintentar ($ATTEMPTS)</i></span>

    rounding      = -1
    shadow_passes = 2
    shadow_size   = 8
    shadow_color  = rgba(0, 0, 0, 0.25)
    position      = 0, -450
    halign        = center
    valign        = center
    zindex        = 2
}
