# Portal/session env
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE

exec-once = nm-applet --indicator
exec-once = ~/.config/hypr/scripts/MediaCtrl.sh daemon
exec-once = hypridle
exec-once = playerctld daemon
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch sh -c 'head -c 5242880 | cliphist store'
exec-once = waybar
exec-once = /home/routel/.local/bin/set-wp.sh 1754774530

# =================================================================
#  ROUTEL — HYPRLAND 0.54.0
# =================================================================
# =================================================================
# HARDWARE
# =================================================================

monitor = DP-1, 1920x1080@75, 0x0, 1

# ── NVIDIA ───────────────────────────────────────────────────────
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# ── ELECTRON / JAVA ───────────────────────────────────────────────
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = _JAVA_AWT_WM_NONREPARENTING,1
env = AWT_TOOLKIT,MToolkit

cursor {
    no_hardware_cursors = true
}

input {
    kb_layout  = us,es
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity  = 0
    touchpad {
        natural_scroll = no
    }
}
xwayland {
    enabled = true
    force_zero_scaling = true
}

# =================================================================
# MISC
# =================================================================
misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
    enable_swallow           = true
    swallow_regex            = ^(kitty)$
}

# =================================================================
# APARIENCIA
# =================================================================

general {
    gaps_in  = 8
    gaps_out = 0
    border_size = 1
    col.active_border   = rgba(ffffff44) rgba(ffffff11) 
    col.inactive_border = rgba(ffffff00)
    layout = dwindle
    allow_tearing = true
}

decoration {
    rounding = 0
    rounding_power = 4.0
   
    shadow {
        enabled      = true
        range        = 4
        render_power = 3
        color        = rgba(00000044)
        offset       = 0 0
        scale        = 1.0
    }

    blur {
        enabled          = true
        size             = 1
        passes           = 2
        vibrancy         = 0.5
        vibrancy_darkness = 0.0
        noise            = 0.02
        contrast         = 0.5
        brightness       = 1
        new_optimizations = true
        xray             = false
        ignore_opacity   = true
        popups           = true
        popups_ignorealpha = 0.2
    }

    dim_inactive = true
    dim_strength = 0.1
    dim_special  = 0.8
    dim_around   = 0.4
}

animations {
    enabled = true
    
    # Una curva de desaceleración pura (Ease Out), sin rebote.
    # El 1.0 al final asegura que la ventana encaje exacto sin pasarse.
    bezier = decel, 0.05, 0.7, 0.1, 1.0

    # Subimos a 4 y 5 para que la animación se aprecie pero siga siendo rápida.
    animation = windows,     1, 4, decel, slide
    animation = windowsOut,  1, 4, decel, slide
    animation = border,      1, 5, default
    animation = fade,        1, 4, default
    
    # Los workspaces se sienten mejor con un deslizamiento un poco más largo
    animation = workspaces,  1, 5, decel, slide
}

dwindle {
    preserve_split = yes
    smart_split    = false
    smart_resizing = true
}

master {
    new_status = master
}

# =================================================================
# WINDOW RULES
# =================================================================

# ── TERMINALES ───────────────────────────────────────────────────
windowrule = match:class ^kitty$,     opacity 1 0.8
windowrule = match:class ^Alacritty$, opacity 0.88 0.82

windowrule = match:class ^floating_kitty$, float on
windowrule = match:class ^floating_kitty$, opacity 0.7 0.75

windowrule = match:class ^floating_kitty$, rounding 16
windowrule = match:class ^floating_kitty$, size (monitor_w*0.9) (monitor_h*0.35)
windowrule = match:class ^floating_kitty$, move (monitor_w*0.05) 40

# ── NAVEGADORES ──────────────────────────────────────────────────
windowrule = match:class ^(firefox|Firefox)$,              opaque on
windowrule = match:class ^(firefox|Firefox)$,              no_blur on
windowrule = match:class ^(brave-browser|Brave-browser)$,  opaque off
windowrule = match:class ^(brave-browser|Brave-browser)$,  no_blur off
windowrule = match:class ^(chromium|Google-chrome)$,       opaque on
windowrule = match:class ^(chromium|Google-chrome)$,       no_blur on

# --- APPLE MUSIC PWA ---
windowrule = float on, match:class ^brave-music\\.apple\\.com.*
windowrule = no_shadow on, match:class ^brave-music\\.apple\\.com.*
windowrule = opaque off, match:class ^brave-music\\.apple\\.com.*
windowrule = no_blur off, match:class ^brave-music\\.apple\\.com.*
windowrule = opacity 1 override 0.75 override, match:class ^brave-music\\.apple\\.com.*
windowrule = workspace special:music, match:class ^brave-music\\.apple\\.com.*
# --- YOUTUBE MUSIC PWA ---
windowrule = float on,             match:class ^brave-music\\.youtube\\.com.*
windowrule = no_shadow on,         match:class ^brave-music\\.youtube\\.com.*
windowrule = opaque off,           match:class ^brave-music\\.youtube\\.com.*
windowrule = no_blur off,          match:class ^brave-music\\.youtube\\.com.*
windowrule = opacity 1 override 0.75 override, match:class ^brave-music\\.youtube\\.com.*
windowrule = workspace special:music, match:class ^brave-music\\.youtube\\.com.*
# --- QOBUZ PWA ---
windowrule = float on,             match:class ^brave-play\\.qobuz\\.com.*
windowrule = no_shadow on,         match:class ^brave-play\\.qobuz\\.com.*
windowrule = opaque off,           match:class ^brave-play\\.qobuz\\.com.*
windowrule = no_blur off,          match:class ^brave-play\\.qobuz\\.com.*
windowrule = opacity 1 override 0.75 override, match:class ^brave-play\\.qobuz\\.com.*
windowrule = workspace special:music, match:class ^brave-play\\.qobuz\\.com.*
# ── GESTORES DE ARCHIVOS ──────────────────────────────────────────
windowrule = match:class ^(thunar|Thunar|org.gnome.Nautilus|nemo|pcmanfm)$, opacity 0.92 0.88

# ── IDEs ──────────────────────────────────────────────────────────
windowrule = match:class ^(Code|code-oss|VSCodium)$,         opacity 0.95 0.90
windowrule = match:class ^(sublime_text|sublime-text)$,      opacity 0.94 0.88

# ── COMUNICACIÓN ─────────────────────────────────────────────────
windowrule = match:class ^(discord|Discord|vesktop|WebCord|slack|teams)$, opacity 0.94 0.88

# ── AUDIO ────────────────────────────────────────────────────────
windowrule = match:class ^pavucontrol$, float on
windowrule = match:class ^pavucontrol$, size 800 600
windowrule = match:class ^pavucontrol$, center on
windowrule = match:class ^pavucontrol$, opacity 0.92 0.88

# ── HACKING ──────────────────────────────────────────────────────
windowrule = match:class ^Burp-StartBurp$,       float on
windowrule = match:class ^Burp-StartBurp$,       opacity 0.96 0.92
windowrule = match:class ^sun-awt-X11-XDialog$,  float on
windowrule = match:title ^Burp Suite,            float on
windowrule = match:title ^Burp Suite,            opacity 0.96 0.92
windowrule = match:class ^maltego$,              float on
windowrule = match:class ^maltego$,              opacity 0.98 0.94

# ── UTILIDADES ───────────────────────────────────────────────────
windowrule = match:class ^localsend$, float on
windowrule = match:class ^localsend$, size 600 500
windowrule = match:class ^localsend$, center on
windowrule = match:class ^localsend$, opacity 0.92 0.88

windowrule = match:class ^ulauncher$, float on
windowrule = match:class ^ulauncher$, center on
windowrule = match:class ^ulauncher$, size 50% 40%
windowrule = match:class ^ulauncher$, rounding 32
windowrule = match:class ^ulauncher$, border_size 0
windowrule = match:class ^ulauncher$, opacity 0.95 0.88
windowrule = no_shadow on, match:class ^ulauncher$

# ── GAMING ───────────────────────────────────────────────────────
windowrule = match:class ^org.prismlauncher.PrismLauncher$, float on
windowrule = match:class ^org.prismlauncher.PrismLauncher$, size 900 600
windowrule = match:class ^org.prismlauncher.PrismLauncher$, center on
windowrule = match:class ^org.prismlauncher.PrismLauncher$, opacity 0.96 0.92

windowrule = match:class ^minecraft-launcher$, opaque on
windowrule = match:class ^Minecraft,           opaque on
windowrule = match:class ^Minecraft,           immediate on
windowrule = match:class ^Minecraft,           no_blur on
windowrule = match:title ^Minecraft,           opaque on
windowrule = match:title ^Minecraft,           immediate on
windowrule = match:title ^Minecraft,           no_blur on

# ── MEDIA / CREATIVOS ────────────────────────────────────────────
windowrule = match:class ^(mpv|vlc|celluloid)$,             opaque on
windowrule = match:class ^(gimp|Gimp|inkscape|krita|blender)$, opaque on
windowrule = match:class ^(steam|gamescope)$,               opaque on
windowrule = match:class ^steam$,                           no_blur on

# ── WIRESHARK ────────────────────────────────────────────────────
windowrule = match:class ^Wireshark$, opacity 0.96 0.92
windowrule = match:class ^Wireshark$, match:title ^.*(Dialog|Preferences|Options|Filter|Capture|Statistics|About).*, float on
windowrule = match:class ^Wireshark$, match:title ^.*(Capture|Statistics|About).*, center on
windowrule = match:class ^Wireshark$, match:title ^Capture.*, size 800 600
windowrule = match:class ^Wireshark$, match:title ^About.*,   size 600 500
windowrule = match:class ^Wireshark$, match:modal true, float on
windowrule = match:class ^Wireshark$, match:modal true, center on
windowrule = match:class ^Wireshark$, match:modal true, no_dim on
windowrule = match:class ^Wireshark$, match:modal true, stay_focused on
windowrule = match:class ^Wireshark$, match:float true, opaque on
windowrule = match:class ^Wireshark$, match:float true, no_blur on

# ── WORKSPACES ESPECIALES ─────────────────────────────────────────
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1],   gapsout:0, gapsin:0

windowrule = match:workspace w[tv1], match:float false, border_size 0
windowrule = match:workspace w[tv1], match:float false, rounding 0
windowrule = match:workspace f[1],   match:float false, border_size 0
windowrule = match:workspace f[1],   match:float false, rounding 0

# --- NEOVIM SPECIAL (EDITOR) ---
windowrule = match:title ^nvim-special$, workspace special:editor silent
windowrule = match:title ^nvim-special$, float on
windowrule = match:title ^nvim-special$, size 85% 85%
windowrule = match:title ^nvim-special$, center on

# =================================================================
# LAYER RULES
# =================================================================

layerrule = blur on,          match:namespace waybar
layerrule = ignore_alpha 0.3, match:namespace waybar

layerrule = blur on,          match:namespace rofi
layerrule = ignore_alpha 0.3, match:namespace rofi
layerrule = blur on,          match:namespace wofi
layerrule = ignore_alpha 0.5, match:namespace wofi

layerrule = blur off,          match:namespace swaync-control-center
layerrule = ignore_alpha 0,   match:namespace swaync-control-center
layerrule = animation slide right, match:namespace swaync-control-center

layerrule = blur off,          match:namespace swaync-notification-window
layerrule = ignore_alpha 0,   match:namespace swaync-notification-window



layerrule = blur on,          match:namespace gtk-layer-shell
layerrule = ignore_alpha 0.3, match:namespace gtk-layer-shell
# waylyrics



# =================================================================
# KEYBINDINGS
# =================================================================

$mainMod = SUPER

# ── APLICACIONES ─────────────────────────────────────────────────
bind = $mainMod,       Return,  exec, kitty --single-instance
bind = $mainMod SHIFT, Return,  exec, foot
bind = $mainMod,       D,       exec, ulauncher
bind = $mainMod,       E,       exec, thunar
bind = $mainMod,       T,       exec, ~/.local/bin/floating_kitty.sh
bind = $mainMod,       A,       exec, pavucontrol
bind = $mainMod SHIFT, F,       exec, firefox
bind = $mainMod SHIFT, B,       exec, brave-origin-nightly
bind = $mainMod SHIFT, C,       exec, caido
#bind = $mainMod SHIFT, M, exec, brave --ozone-platform=wayland --enable-features=WaylandWindowDecorations --app="https://music.apple.com/"
#bind = $mainMod SHIFT, W,exec,warp-terminal 
#bind = $mainMod SHIFT, M, exec, brave --ozone-platform=wayland --enable-features=WaylandWindowDecorations --app="https://music.youtube.com"

bind = $mainMod SHIFT, M, exec, brave --ozone-platform=wayland --enable-features=WaylandWindowDecorations --app="https://play.qobuz.com/"

bind = $mainMod SHIFT, TAB, exec, kitty 
# --- WAYLYRICS ---
windowrule = workspace special:music silent, match:class ^io\.github\.waylyrics\.Waylyrics$
windowrule = float on,    match:class ^io\.github\.waylyrics\.Waylyrics$
windowrule = no_blur on,  match:class ^io\.github\.waylyrics\.Waylyrics$
windowrule = no_dim on,   match:class ^io\.github\.waylyrics\.Waylyrics$   # <-- agrega esto
windowrule = opaque on,   match:class ^io\.github\.waylyrics\.Waylyrics$   # <-- y esto si sigue transparente

# ── SISTEMA / SESIÓN ─────────────────────────────────────────────
bind = $mainMod,       L,       exec,    ~/.config/hypr/scripts/lock.sh
bind = $mainMod,       N,       exec,    swaync-client -t -sw
bind = $mainMod,       Escape,  exec,    hyprctl reload
bind = $mainMod,       M,       exec,    ~/.config/waybar/relaunch.sh
bind = $mainMod CONTROL, M, togglespecialworkspace, music
workspace = special:music, gapsout:0, gapsin:0
# ── CLIPBOARD ────────────────────────────────────────────────────
bind = $mainMod,       V,  exec,  cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod SHIFT, S,  exec,  grim -g "$(slurp)" - | wl-copy && notify-send "Captura" "Área copiada" -i camera-photo

# ── VENTANAS ─────────────────────────────────────────────────────
bind = $mainMod, W,  killactive
bind = $mainMod, S,  togglefloating
bind = $mainMod, F,  fullscreen,      0
bind = $mainMod, P,  pseudo
bind = $mainMod, I,  layoutmsg,       togglesplit

# ── FOCO ─────────────────────────────────────────────────────────
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
# ── MOVER VENTANA ────────────────────────────────────────────────
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# ── REDIMENSIONAR ────────────────────────────────────────────────
binde = $mainMod CTRL, left,  resizeactive, -20 0
binde = $mainMod CTRL, right, resizeactive,  20 0
binde = $mainMod CTRL, up,    resizeactive,  0 -20
binde = $mainMod CTRL, down,  resizeactive,  0  20

# ── RATÓN ────────────────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── ROFI ─────────────────────────────────────────────────────────
bind = ALT, Tab, exec, rofi -show window -theme ~/.config/rofi/config.rasi

# --- PORTAL DE EDICIÓN (NEOVIM) ---

# Abrir/Cerrar el portal (Super + X)
bind = $mainMod, X, togglespecialworkspace, editor

# Lanzar el servidor de Neovim por primera vez (Control + Shift + X)
bind = CONTROL SHIFT, X, exec, ~/.local/bin/nvim-special-launch.sh

# =================================================================
# WORKSPACES
# =================================================================

# Cambiar workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover ventana a workspace (con foco)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mover ventana a workspace (silencioso)
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10

# Navegación relativa
bind = $mainMod ALT, left,       workspace, e-1
bind = $mainMod ALT, right,      workspace, e+1
bind = $mainMod,     mouse_down, workspace, e+1
bind = $mainMod,     mouse_up,   workspace, e-1

# =================================================================
# MULTIMEDIA
# =================================================================

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume        @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@   toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPrev,        exec, playerctl previous
bindl  = , XF86AudioStop,        exec, playerctl stop
