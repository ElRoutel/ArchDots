# include hyde.conf
cursor_trail 0
cursor_trail_decay 0.1 0.4
cursor_blink_interval 0.5
# ═══════════════════════════════════════════════════════════════════════════════
#  KITTY CONFIGURATION - ROUTEL
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
#  SHELL
# ═══════════════════════════════════════════════════════════════════════════════
shell /bin/zsh --login --interactive
editor .

# ═══════════════════════════════════════════════════════════════════════════════
#  FUENTES
# ═══════════════════════════════════════════════════════════════════════════════
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12
disable_ligatures never
adjust_line_height  110%
adjust_column_width 0

# ═══════════════════════════════════════════════════════════════════════════════
#  COLORES TOKYO NIGHT
# ═══════════════════════════════════════════════════════════════════════════════
#foreground        #c0caf5
#background        #1a1b26
#selection_foreground #c0caf5
#selection_background #33467c

color0  #1a1b26
color8  #414868
color1  #f7768e
color9  #f7768e
color2  #9ece6a
color10 #9ece6a
color3  #e0af68
color11 #e0af68
color4  #7aa2f7
color12 #7aa2f7
color5  #ad8ee6
color13 #ad8ee6
color6  #34d9a5
color14 #34d9a5
color7  #c0caf5
color15 #c0caf5

# ═══════════════════════════════════════════════════════════════════════════════
#  CURSOR
# ═══════════════════════════════════════════════════════════════════════════════
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0
cursor_stop_blinking_after 15.0

# ═══════════════════════════════════════════════════════════════════════════════
#  VENTANA
# ═══════════════════════════════════════════════════════════════════════════════
window_padding_width 8
window_margin_width 0
dynamic_background_opacity yes
background_opacity 0.7
confirm_os_window_close 0
remember_window_size  yes
initial_window_width  1280
initial_window_height 720
placement_strategy center
draw_minimal_borders yes
window_border_width 1pt
active_border_color #7aa2f7
inactive_border_color #414868

# ═══════════════════════════════════════════════════════════════════════════════
#  TAB BAR
# ═══════════════════════════════════════════════════════════════════════════════
tab_bar_style powerline
tab_powerline_style slanted
tab_separator ""
active_tab_background #98c379
inactive_tab_background #e06c75
inactive_tab_foreground #000000
tab_bar_margin_color black
tab_bar_edge top
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0
tab_title_template "{index}: {title[title.rfind('/')+1:]}"

# ═══════════════════════════════════════════════════════════════════════════════
#  SCROLLBACK
# ═══════════════════════════════════════════════════════════════════════════════
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 10

# ═══════════════════════════════════════════════════════════════════════════════
#  MOUSE
# ═══════════════════════════════════════════════════════════════════════════════
mouse_hide_wait 3.0
detect_urls yes
url_color #61afef
url_style curly
copy_on_select yes
open_url_with default
mouse_map ctrl+left click ungrabbed mouse_handle_click selection link prompt
strip_trailing_spaces smart

# ═══════════════════════════════════════════════════════════════════════════════
#  PERFORMANCE
# ═══════════════════════════════════════════════════════════════════════════════
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ═══════════════════════════════════════════════════════════════════════════════
#  BELL
# ═══════════════════════════════════════════════════════════════════════════════
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no
bell_on_tab no

# ═══════════════════════════════════════════════════════════════════════════════
#  CLIPBOARD
# ═══════════════════════════════════════════════════════════════════════════════
clipboard_control write-clipboard write-primary read-clipboard-ask
clipboard_max_size 512

# ═══════════════════════════════════════════════════════════════════════════════
#  ADVANCED
# ═══════════════════════════════════════════════════════════════════════════════
allow_remote_control yes
listen_on unix:@mykitty
update_check_interval 24

# ═══════════════════════════════════════════════════════════════════════════════
#  KEYBINDINGS - TABS
# ═══════════════════════════════════════════════════════════════════════════════
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+q close_tab
map ctrl+shift+. move_tab_forward
map ctrl+shift+, move_tab_backward
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
map ctrl+shift+alt+t set_tab_title

# ═══════════════════════════════════════════════════════════════════════════════
#  KEYBINDINGS - VENTANAS
# ═══════════════════════════════════════════════════════════════════════════════
map ctrl+shift+w close_window
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+h launch --location=hsplit --cwd=current
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down
map ctrl+shift+up move_window up
map ctrl+shift+down move_window down
map ctrl+alt+left resize_window narrower
map ctrl+alt+right resize_window wider
map ctrl+alt+up resize_window taller
map ctrl+alt+down resize_window shorter
map ctrl+alt+r start_resizing_window
map ctrl+alt+0 resize_window reset

# ═══════════════════════════════════════════════════════════════════════════════
#  KEYBINDINGS - LAYOUTS
# ═══════════════════════════════════════════════════════════════════════════════
map ctrl+shift+z toggle_layout stack
map ctrl+shift+l next_layout
enabled_layouts splits,stack,tall,fat,grid

# ═══════════════════════════════════════════════════════════════════════════════
#  KEYBINDINGS - CLIPBOARD Y BUFFERS
# ═══════════════════════════════════════════════════════════════════════════════
map F1 copy_to_buffer a
map F2 paste_from_buffer a
map F3 copy_to_buffer b
map F4 paste_from_buffer b
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+s paste_from_selection

# ═══════════════════════════════════════════════════════════════════════════════
#  KEYBINDINGS - SCROLLBACK
# ═══════════════════════════════════════════════════════════════════════════════
map ctrl+shift+/ show_scrollback
map ctrl+shift+g show_last_command_output
map ctrl+shift+f launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end

# ═══════════════════════════════════════════════════════════════════════════════
#  KEYBINDINGS - ZOOM Y FUENTES
# ═══════════════════════════════════════════════════════════════════════════════
map ctrl+shift+] change_font_size all +2.0
map ctrl+shift+[ change_font_size all -2.0
map ctrl+shift+0 change_font_size all 0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+f11 toggle_fullscreen
map ctrl+shift+f toggle_maximized

# ═══════════════════════════════════════════════════════════════════════════════
#  KEYBINDINGS - HINTS
# ═══════════════════════════════════════════════════════════════════════════════
map ctrl+shift+e open_url_with_hints
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>o kitten hints --type path --program @
map ctrl+shift+p>h kitten hints --type hash --program @
map ctrl+shift+p>l kitten hints --type line --program @
map ctrl+shift+p>v kitten hints --type path --program "code"

# ═══════════════════════════════════════════════════════════════════════════════
#  KEYBINDINGS - UTILIDADES
# ═══════════════════════════════════════════════════════════════════════════════
map ctrl+shift+f5 load_config_file
map ctrl+shift+delete clear_terminal reset active
map ctrl+shift+u kitten unicode_input
map ctrl+shift+f2 edit_config_file

# ═══════════════════════════════════════════════════════════════════════════════
#  KITTENS
# ═══════════════════════════════════════════════════════════════════════════════
map ctrl+shift+d launch --type=overlay --cwd=current git diff
map ctrl+shift+s launch --type=tab --cwd=current ssh

# ═══════════════════════════════════════════════════════════════════════════════
#  HYPERLINKS
# ═══════════════════════════════════════════════════════════════════════════════
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh

